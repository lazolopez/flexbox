<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Botón con Media Queries</title>

        <style>
            body {
                font-family: Arial, sans-serif;
                text-align: center;
                padding: 40px 15px;
                background-color: #f0f0f0;
            }

            /* Estilos generales: escritorio */
            .boton {
                padding: 20px 30px;
                border: none;
                border-radius: 8px;
                background-color: #198754;
                color: white;
                font-size: 18px;
                cursor: pointer;
            }

            /* Texto generado por CSS */
            .boton::before {
                content: "Escritorio: sin media query específica";
            }

            /* TABLETA: hasta 900 px */
            @media screen and (max-width: 900px) {
                .boton {
                    background-color: #ffc107;
                    color: #222;
                }

                .boton::before {
                    content: "Tableta: @media (max-width: 900px)";
                }
            }

            /* MÓVIL: hasta 600 px */
            @media screen and (max-width: 600px) {
                .boton {
                    background-color: #dc3545;
                    color: white;
                }

                .boton::before {
                    content: "Móvil: @media (max-width: 600px)";
                }
            }
        </style>
    </head>

    <article>
        <h1>Botón responsive</h1>
        <p>Cambia el ancho de la ventana del navegador:</p>

        <button class="boton responsive" type="button"></button>
    </article>
</html>
